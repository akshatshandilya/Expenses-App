<title>Expenses Log Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width shell (max 430px) with a floating bottom nav; sub-screens hide the nav and use a back header.
   Design tokens below are the shared spec the Android build will reuse. */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --s2:#F3F7F5; --ink:#12201B; --ink2:#4E5F58; --ink3:#66776F; --line:#D8E1DC;
  --accent:#0E6B58; --onacc:#FFFFFF; --soft:#DCEFE8; --gold:#B8790A;
  --bad:#B3261E; --badbg:#FBE8E5; --good:#17784A; --goodbg:#E1F3E9; --warnbg:#FFF1D0; --warn:#8A5A00;
  --shadow:0 1px 2px rgba(18,32,27,.06),0 8px 22px rgba(18,32,27,.05);
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --fb:'Figtree','Segoe UI',system-ui,sans-serif;
  --r-card:18px; --r-ctl:14px; --pad:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#142019; --s2:#1B2923; --ink:#E8F1ED; --ink2:#A9B9B2; --ink3:#92A39B; --line:#273732;
  --accent:#52C7A9; --onacc:#06231B; --soft:#18362D; --gold:#E3B341;
  --bad:#F2877F; --badbg:#3A1E1B; --good:#5CCB8C; --goodbg:#16301F; --warnbg:#3A2E10; --warn:#F0C766;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#142019; --s2:#1B2923; --ink:#E8F1ED; --ink2:#A9B9B2; --ink3:#92A39B; --line:#273732;
  --accent:#52C7A9; --onacc:#06231B; --soft:#18362D; --gold:#E3B341;
  --bad:#F2877F; --badbg:#3A1E1B; --good:#5CCB8C; --goodbg:#16301F; --warnbg:#3A2E10; --warn:#F0C766;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--fb);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.shell{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){
  body{align-items:center}
  .shell{--pad:18px;height:min(100%,880px);border:1px solid var(--line);border-radius:32px;padding-inline:18px;box-shadow:var(--shadow)}
}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 0 110px;scrollbar-width:thin}
.screen.nonav{padding-bottom:24px}
.ic{flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* type */
.th h1,.hd h1{font:700 26px/1.15 var(--fd);letter-spacing:-.01em}
.hd h1{font-size:21px;flex:1;min-width:0}
.eyebrow{font:600 11.5px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:13.5px}
.th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hd{display:flex;align-items:center;gap:8px;margin:0 0 12px}

/* controls */
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ib.flat{border-color:transparent;background:transparent}
.btn{min-height:50px;border-radius:var(--r-ctl);border:1px solid transparent;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border-color:var(--line)}
.btn.pri{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.btn.soft{background:var(--soft);color:var(--accent);border-color:transparent}
.btn.dan{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}
.mlabel{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 15px var(--fd);display:flex;align-items:center;justify-content:center;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--s2);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-weight:600;padding:0 8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.fld .seg{margin-bottom:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:12px}
.card.flat{box-shadow:none}
.card h2{font:700 16px var(--fd);margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:0}

/* category chip */
.ci{--c:#6F8079;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);
  background:color-mix(in srgb,var(--c) 15%,var(--surface))}

/* hero */
.hero{padding:16px}
.hero .big{font-size:42px;line-height:1.05;margin:6px 0 4px}
.delta{font-size:13.5px;color:var(--ink2)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--s2);border:1px solid var(--line);color:var(--ink2)}
.pill.good{background:var(--goodbg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.demo{font:700 9.5px/1 var(--fb);letter-spacing:.08em;font-style:normal;padding:3px 5px;border-radius:6px;background:var(--warnbg);color:var(--warn);vertical-align:2px;margin-left:4px}

/* tiles */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:12px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface);min-height:118px;min-width:0}
.tile b{font-size:13px;font-weight:600;line-height:1.2;color:var(--ink2);overflow-wrap:anywhere}
.tile .num{font-size:17px;margin-top:auto}
.tile small{font-size:11.5px;color:var(--good);font-weight:600;margin-top:-6px}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink2);background:transparent}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sech h2{font:700 17px var(--fd)}
.link{background:none;border:0;color:var(--accent);font-weight:700;min-height:36px;padding:0 4px}

/* record rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin-bottom:12px}
.rec{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:64px}
.list>:last-child{border-bottom:0}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font:700 15.5px var(--fd);font-variant-numeric:tabular-nums;text-align:right;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.amt.in{color:var(--good)}
.due{font:700 10.5px var(--fb);font-style:normal;color:var(--warn);background:var(--warnbg);padding:2px 6px;border-radius:6px;margin-top:2px}
.daylab{padding:8px 14px;background:var(--s2);font:600 12px var(--fb);color:var(--ink2);letter-spacing:.04em;border-bottom:1px solid var(--line)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.stat b{font:700 20px var(--fd);font-variant-numeric:tabular-nums}

/* forms */
.fld{margin-bottom:16px}
.fld label,.fld .lb{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px;margin-bottom:6px}
.fld label small{font-weight:500;color:var(--ink3);margin-left:6px}
.ro{font:700 13px var(--fd);color:var(--accent);font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=month],input[type=search],select,textarea,.pre{width:100%;min-height:50px;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
textarea{padding:12px 14px;min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.pre{display:flex;align-items:center;gap:8px;padding:0 14px}
.pre span{font:700 17px var(--fd);color:var(--ink2)}
.pre input{border:0;background:transparent;flex:1;min-width:0;min-height:48px;padding:0;outline:0;font-size:17px;font-variant-numeric:tabular-nums}
.pre:focus-within{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.qty{display:flex;gap:8px;align-items:center}
.qty .pre{flex:1}
.qty .ib{width:50px;height:50px;font:700 22px var(--fd)}
.sfx{color:var(--ink2);font-size:13px;white-space:nowrap}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px}
.hint:empty{display:none}
.err{font-size:12.5px;color:var(--bad);font-weight:600;margin-top:6px}
.err:empty{display:none}
.fld.bad input,.fld.bad .pre,.fld.bad select{border-color:var(--bad)}
.sw{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .trk{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+.trk{background:var(--accent)}
.sw input:checked+.trk::after{transform:translateX(20px)}
.sw input:focus-visible+.trk{outline:3px solid var(--accent);outline-offset:2px}
.calc{background:var(--soft);border-radius:var(--r-card);padding:14px;margin-bottom:16px}
.calc .formula{font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.calc .pre{background:transparent;border:0;padding:0;min-height:58px}
.calc .pre span{font-size:28px;color:var(--accent)}
.calc .pre input{font:700 34px var(--fd);letter-spacing:-.02em;color:var(--accent)}
.calc .pre:focus-within{outline:0}
.cta{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:8px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;font-size:13.5px;margin-bottom:12px}
.warnbox[hidden]{display:none}
.note{font-size:13px;color:var(--ink2);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:12px}

/* water */
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;background:var(--soft);color:var(--accent);border:0;font-weight:700;font-size:13px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font:700 11.5px var(--fb);color:var(--ink3);padding:4px 0}
.day{aspect-ratio:1;min-height:42px;border-radius:14px;border:1.5px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 15px var(--fb);font-variant-numeric:tabular-nums;position:relative}
.day i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.day:not(.has) i{background:transparent}
.day.today{border-color:var(--ink3)}
.day.sel{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.day.sel i{background:var(--onacc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tagp{font:700 11px var(--fb);padding:2px 7px;border-radius:8px;background:var(--s2);color:var(--ink2);border:1px solid var(--line);display:inline-block;margin-top:3px}
.tagp.diff{background:var(--warnbg);color:var(--warn);border-color:transparent}

/* travel & rent cards */
.tabs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tcard{--c:var(--accent);display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px;border-radius:var(--r-card);border:1.5px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.tcard[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.tcard b{font-size:13px}
.tcard .num{font-size:16px}
.opt{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r-card);border:1.5px solid var(--line);background:var(--surface);margin-bottom:12px}
.opt .ci{width:48px;height:48px}
.opt h3{font:700 18px var(--fd);margin-bottom:2px}
.opt p{font-size:13.5px;color:var(--ink2)}
.opt .num{display:block;font-size:20px;margin-top:10px}

/* reports */
.bar{display:flex;align-items:center;gap:10px;padding:8px 0}
.bar .bt{flex:1;min-width:0}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.bar .top span:last-child{font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--s2);margin-top:6px;overflow:hidden}
.track div{height:100%;border-radius:99px;background:var(--c,var(--accent))}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.chart .sel{fill:var(--accent)}
.chart text{fill:var(--ink2);font:600 10px var(--fb)}
.chart .ax{stroke:var(--line);stroke-width:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* empty */
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ci{width:56px;height:56px;border-radius:18px}
.empty h3{font:700 17px var(--fd)}
.empty p{color:var(--ink2);font-size:14px;max-width:30ch}

.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.clockb{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-height:44px;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:right}
.clockb .clkd{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--fd);font-variant-numeric:tabular-nums}
.clockb .clkt{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rt small.stamp{font-size:11.5px;color:var(--ink3)}
.paidbtn{width:100%;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;margin:4px 0 14px}
.paidbtn .bx{width:30px;height:30px;border-radius:9px;border:2px solid var(--ink3);display:grid;place-items:center;flex:none;color:transparent}
.paidbtn b{display:block;font:700 17px var(--fd)}
.paidbtn small{color:var(--ink2);font-size:12.5px}
.paidbtn.on{border-color:var(--accent);background:var(--soft)}
.paidbtn.on .bx{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
/* nav */
.nav{position:absolute;left:var(--pad);right:var(--pad);bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);z-index:10}
.nav[hidden]{display:none}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:transparent;color:var(--ink3);font:600 11.5px var(--fb);border-radius:18px}
.nav button[aria-current=page]{background:var(--soft);color:var(--accent)}

/* layers */
.layer{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden],.toast[hidden],.lockl[hidden]{display:none}
.layer.mid{align-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(8,16,12,.55)}
.sheet{position:relative;width:100%;max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:12px 18px 22px;animation:up .2s ease-out}
.layer.mid .sheet{border-radius:24px;max-height:92%}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.layer.mid .grab{display:none}
.sheet h2{font:700 20px var(--fd);margin-bottom:6px}
.sheet .row2{display:flex;gap:10px;margin-top:16px}
.sheet .row2>*{flex:1}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer}
.radio:has(input:checked){border-color:var(--accent);background:var(--soft)}
.radio input{margin-top:4px;accent-color:var(--accent);width:20px;height:20px;flex:none}
.radio b{display:block}
.radio span{font-size:13px;color:var(--ink2)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:90%;box-shadow:var(--shadow);animation:up .18s ease-out;display:flex;gap:8px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
.lockl{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.lockl .ci{width:72px;height:72px;border-radius:24px}
pre.csv,textarea.mono{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:220px;overflow:auto;white-space:pre;width:100%;min-height:120px}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* welcome */
.welcome{padding-top:8px}
.brand{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.brand h1{font:800 38px/1 var(--fd);letter-spacing:-.03em}
.logo{width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--onacc);display:grid;place-items:center}
.lead{font-size:16.5px;color:var(--ink2);margin-bottom:16px}
.pts{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.pts li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.pts b{display:block}
.pts span{font-size:13.5px;color:var(--ink2)}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink2)}
ol.steps li{margin-bottom:4px}
</style>

<div class="shell" id="shell">
  <main class="screen" id="screen"></main>
  <nav class="nav" id="nav" aria-label="Main" hidden></nav>
  <div class="layer" id="layer" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="lockl" id="lockl" hidden></div>
</div>

<script>
(function(){
'use strict';
/* ---------- constants & icons ---------- */
const KEY='expenses-prototype-v1';

const $=(s,r)=>(r||document).querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const today=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate());};
const curMonth=()=>today().slice(0,7);
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function addMonths(mk,n){const a=mk.split('-').map(Number);const d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
const monLabel=mk=>{const a=mk.split('-').map(Number);return MONTHS[a[1]-1]+' '+a[0];};
const monShort=mk=>{const a=mk.split('-').map(Number);return MONTHS[a[1]-1].slice(0,3)+' '+a[0];};
const validMonth=s=>/^\d{4}-(0[1-9]|1[0-2])$/.test(s||'')&&+s.slice(0,4)>=2000;
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;const a=s.split('-').map(Number);const t=new Date(a[0],a[1]-1,a[2]);return t.getFullYear()===a[0]&&t.getMonth()===a[1]-1&&t.getDate()===a[2]&&a[0]>=2000&&a[0]<=2100;}
const fmtDate=s=>validDate(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const weekday=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('en-IN',{weekday:'long'});};
/* Date and time a log was added, in the device's time zone, e.g. 15/10/2026, 10:12 am */
function fmtStamp(ts){if(!ts)return '';const d=new Date(ts);if(isNaN(d))return '';return ymd(d.getFullYear(),d.getMonth()+1,d.getDate()).split('-').reverse().join('/')+', '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});}
const daysBetween=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);};
/* Time left until an agreement ends: whole months when a month or more remains, otherwise days. */
function leftInfo(end){
  const t=today(),d=daysBetween(t,end);
  if(d<0)return{t:'Expired '+(-d)+(d===-1?' day':' days')+' ago',tone:'bad'};
  if(d===0)return{t:'Expires today',tone:'warn'};
  const a=t.split('-').map(Number),b=end.split('-').map(Number);let m=(b[0]-a[0])*12+(b[1]-a[1]);if(b[2]<a[2])m--;
  if(m<1)return{t:d+(d===1?' day':' days')+' left',tone:'warn'};
  return{t:m+(m===1?' month':' months')+' left',tone:m<=2?'warn':'good'};
}
/* money: integer paise. quantity: integer thousandths. */
function parseMoney(s){s=String(s==null?'':s).trim().replace(/,/g,'');if(!/^\d+(\.\d{0,2})?$/.test(s))return null;const p=s.split('.');return parseInt(p[0],10)*100+parseInt(((p[1]||'')+'00').slice(0,2),10);}
function parseQty(s){s=String(s==null?'':s).trim();if(!/^\d+(\.\d{1,3})?$/.test(s))return null;const p=s.split('.');return parseInt(p[0],10)*1000+parseInt(((p[1]||'')+'000').slice(0,3),10);}
const mul=(qM,uP)=>Math.floor((qM*uP+500)/1000); /* qty x unit price, rounded half-up to the paisa */
function fmt(p){const neg=p<0;p=Math.abs(p);const r=Math.floor(p/100),f=p%100;let s=r.toLocaleString('en-IN');if(f)s+='.'+pad(f);return (neg?'−':'')+'₹'+s;}
const rs=p=>p%100?(p/100).toFixed(2):String(p/100);
const qtyStr=m=>String(m/1000);
function fmtK(p){const r=p/100;if(r>=100000)return (r/100000).toFixed(1).replace('.0','')+'L';if(r>=10000)return Math.round(r/1000)+'k';if(r>=1000)return (r/1000).toFixed(1).replace('.0','')+'k';return String(Math.round(r));}

/* ---------- business rules ---------- */
const recMonth=r=>r.period||r.date.slice(0,7);
const isIncome=r=>r.cat==='rent'&&r.dir==='received';
const counted=r=>r.status!=='due'&&!isIncome(r);
const recsIn=(mk,f)=>S.records.filter(r=>recMonth(r)===mk&&(!f||f(r)));
const sum=rs_=>rs_.reduce((a,r)=>a+r.amountP,0);
const spent=mk=>sum(recsIn(mk,counted));
const catSpent=(mk,id)=>sum(recsIn(mk,r=>r.cat===id&&counted(r)));
function priceOn(key,d){const pr=S.prices[key];if(!pr)return null;let v=pr.hist[0].price;pr.hist.forEach(h=>{if(h.from<=d)v=h.price;});return v;}
function setPrice(key,p,mode){const t=today();let pr=S.prices[key];const old=pr?pr.cur:null;
  if(!pr){pr=S.prices[key]={cur:p,hist:[{from:'0000-00-00',price:p}],log:[]};}
  else if(mode==='all'){pr.hist=[{from:'0000-00-00',price:p}];pr.cur=p;}
  else{pr.hist=pr.hist.filter(h=>h.from!==t);pr.hist.push({from:t,price:p});pr.hist.sort((a,b)=>a.from<b.from?-1:1);pr.cur=p;}
  pr.log.push({at:t,from:old,to:p,mode:mode});persist();}

function recTitle(r){
  switch(r.cat){
    case 'water':return 'Water bottles';
    case 'gas':return 'Gas cylinders';
    case 'groceries':return r.title||'Groceries';
    case 'electricity':{const h=houseOf(r.houseId);return 'Electricity'+(h?' \u00B7 '+h.name:'');}
    case 'waterbill':return 'Water bill';
    case 'travel':return r.sub==='fuel'?'Fuel · '+((r.x&&r.x.fuelType)||'Fuel'):r.sub==='toll'?(r.party||'Toll'):(r.title||'Travel charge');
    case 'rent':return (r.dir==='received'?'Rent received':'Rent paid')+(r.party?' · '+r.party:'');
    default:{const c=catOf(r.cat);return r.title||(c?c.name:'Expense');}
  }
}
function recSub(r){
  const b=[fmtDate(r.date)];
  if(r.qtyM&&r.unitP)b.push(qtyStr(r.qtyM)+' × '+fmt(r.unitP));
  if(r.period)b.push('For '+monShort(r.period));
  if(r.cat==='groceries'&&r.party)b.push(r.party);
  if(r.cat==='travel'&&r.sub==='toll'&&r.x&&r.x.vehicle)b.push(r.x.vehicle);
  return b.join(' · ');
}
function recRow(r){

}

V.rent=()=>{
  const mk=S.mon,P=recsIn(mk,r=>r.cat==='rent'&&r.dir==='paid'),R=recsIn(mk,r=>r.cat==='rent'&&r.dir==='received');
  const o=(dir,ico,t,d,list)=>'<button class="opt" data-act="rentPick" data-v="'+dir+'"><span class="ci" style="--c:#C0558C">'+ic(ico,24)+'</span><span style="flex:1;min-width:0"><h3>'+t+'</h3><p>'+d+'</p><span class="num">'+fmt(sum(list.filter(r=>r.status!=='due')))+'</span><span class="sub">'+list.length+' record'+(list.length===1?'':'s')+' in '+monShort(mk)+'</span></span>'+ic('chevR',20)+'</button>';
  return hd('Rent')+'<h2 style="font:700 20px var(--fd);margin:2px 2px 4px">What would you like to log?</h2><p class="sub" style="margin:0 2px 14px">Choose one. Paid and received rent are kept in separate logs.</p>'+
   o('paid','arrOut','Rent paid','Rent you pay to a landlord. Counted in your household spending.',P)+
   o('received','arrIn','Rent received','Rent you collect from a tenant. Kept as income and not counted as spending.',R);
};
V.rentLog=()=>{
  const dir=UI.rentDir,mk=S.mon,a=recsIn(mk,r=>r.cat==='rent'&&r.dir===dir).sort((x,y)=>x.date<y.date?1:-1);
  const done=sum(a.filter(r=>r.status!=='due')),due=sum(a.filter(r=>r.status==='due'));
  const pd=dir==='paid';
  return hd('Rent')+
   '<div class="seg" role="tablist"><button role="tab" aria-selected="'+pd+'" class="'+(pd?'on':'')+'" data-act="rentDir" data-v="paid">Rent paid</button><button role="tab" aria-selected="'+!pd+'" class="'+(!pd?'on':'')+'" data-act="rentDir" data-v="received">Rent received</button></div>'+monNav()+
   '<section class="card"><div class="eyebrow">'+(pd?'Paid':'Received')+' for '+monLabel(mk)+'</div><div class="num" style="font-size:34px;margin:4px 0 6px;'+(pd?'':'color:var(--good)')+'">'+fmt(done)+'</div>'+
   '<div class="pills"><span class="pill">'+a.length+' record'+(a.length===1?'':'s')+'</span>'+(due?'<span class="pill warn">Due '+fmt(due)+'</span>':'')+'<span class="pill '+(pd?'':'good')+'">'+(pd?'Counted as spending':'Income, not counted as spending')+'</span></div></section>'+agCards(dir)+
   (a.length?recList(a):empty('key','No rent '+(pd?'paid':'received')+' for '+monLabel(mk),'Log a '+(pd?'payment to your landlord':'receipt from your tenant')+' for this month.'))+
   '<div class="cta"><button class="btn pri block" data-act="rentAdd">'+ic('plus',20)+'Log rent '+(pd?'paid':'received')+'</button></div>';
};

/* entry form */
function fieldHtml(f){
  const v=F.vals,k=f.k,id='f_'+k,val=v[k]==null?'':v[k];
  const show=!f.show||f.show(v);
  const ro=(f.t==='date'||f.t==='month')?'<span class="ro" id="ro_'+k+'">'+(f.t==='date'?fmtDate(val):(validMonth(val)?monShort(val):''))+'</span>':'';
  const lab=f.l&&f.t!=='switch'&&f.t!=='seg'&&f.t!=='calc'?'<label for="'+id+'">'+f.l+(f.opt?'<small>optional</small>':'')+ro+'</label>':(f.t==='seg'?'<div class="lb">'+f.l+'</div>':'');
  let inner='';
  switch(f.t){
    case 'date':inner='<input id="'+id+'" type="date" data-f="'+k+'" value="'+esc(val)+'" min="2000-01-01" max="2100-12-31">';break;
    case 'month':inner='<input id="'+id+'" type="month" data-f="'+k+'" value="'+esc(val)+'" min="2000-01" max="2100-12">';break;
    case 'text':inner='<input id="'+id+'" type="text" data-f="'+k+'" value="'+esc(val)+'" maxlength="80" autocomplete="off" placeholder="'+esc(f.ph||'')+'">';break;
    case 'area':inner='<textarea id="'+id+'" data-f="'+k+'" maxlength="200" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';break;
    case 'money':inner='<div class="pre"><span>₹</span><input id="'+id+'" inputmode="decimal" data-f="'+k+'" value="'+esc(val)+'" placeholder="0" autocomplete="off"></div>';break;
    case 'qty':inner='<div class="qty">'+(f.step?'<button type="button" class="ib" data-act="step" data-k="'+k+'" data-d="-1" aria-label="Decrease">−</button>':'')+'<div class="pre"><input id="'+id+'" inputmode="decimal" data-f="'+k+'" value="'+esc(val)+'" placeholder="0" autocomplete="off"><span class="sfx" style="font:500 13px var(--fb)">'+esc(typeof f.sfx==='function'?f.sfx(v):(f.sfx||''))+'</span></div>'+(f.step?'<button type="button" class="ib" data-act="step" data-k="'+k+'" data-d="1" aria-label="Increase">+</button>':'')+'</div>';break;
    case 'select':inner='<select id="'+id+'" data-f="'+k+'"><option value="">Not specified</option>'+f.opts.map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';break;
    case 'hsel':inner='<select id="'+id+'" data-f="'+k+'"><option value="">Choose a house</option>'+S.houses.map(h=>'<option value="'+esc(h.id)+'"'+(h.id===val?' selected':'')+'>'+esc(h.name)+'</option>').join('')+'</select>';break;
    case 'seg':inner='<div class="seg" role="radiogroup" aria-label="'+esc(f.l)+'">'+f.opts.map(o=>'<button type="button" role="radio" aria-checked="'+(val===o[0])+'" class="'+(val===o[0]?'on':'')+'" data-act="seg" data-k="'+k+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>').join('')+'</div>';break;
    case 'switch':inner='<label class="sw"><input type="checkbox" role="switch" data-f="'+k+'"'+(val?' checked':'')+'><span class="trk"></span><span>'+f.l+'</span></label>';break;
    case 'calc':inner='<div class="calc"><div class="formula" id="formula" aria-live="polite"></div><div class="pre"><span>₹</span><input id="f_total" inputmode="decimal" data-f="total" value="'+esc(val)+'" aria-label="Total amount" readonly></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="sub" id="calcNote"></span><button type="button" class="link" id="editLink" data-act="editTotal" hidden></button></div></div>';break;
  }
  return '<div class="fld" data-fk="'+k+'"'+(show?'':' hidden')+'>'+lab+inner+'<p class="hint" id="hint_'+k+'">'+(f.hint?esc(f.hint(v)):'')+'</p><p class="err" data-err="'+k+'" role="alert"></p></div>';
}
V.entry=()=>{
  if(!F)return hd('Entry')+empty('info','Nothing to edit','Go back and try again.');
  const sp=F.sp;
  return hd(esc(sp.title))+'<div class="warnbox" id="warn" role="alert" hidden></div>'+sp.fields.map(fieldHtml).join('')+
   '<div class="cta"><button class="btn pri block" id="saveBtn" data-act="saveForm">'+ic('check',20)+esc(sp.save||'Save')+'</button></div>';
};

const defDate=p=>p.date||(S.mon===curMonth()?today():S.mon+'-01');
const unitHint=(id,v)=>{const u=parseMoney(v.unit),d=validDate(v.date)?priceOn(id,v.date):null;
  if(d==null)return 'This price becomes your default for next time.';
  return u!=null&&u!==d?'Default is '+fmt(d)+'. Only this entry uses '+fmt(u)+'.':'Using the default price of '+fmt(d)+'.';};
function unitSpec(p){
  const c=catOf(p.cat),W=c.kind==='water',un=c.unit||'unit',ups=c.units||un+'s';
  return{cat:c.id,calc:true,title:(p.id?'Edit ':'Add ')+(W?'delivery':'purchase'),save:W?'Save delivery':'Save purchase',
   fields:[{k:'date',t:'date',l:W?'Delivery date':'Purchase date'},{k:'qty',t:'qty',l:W?'Quantity':'Number of '+ups,step:1,sfx:ups,req:1},
    {k:'unit',t:'money',l:'Price per '+un,hint:v=>unitHint(c.id,v)},{k:'total',t:'calc'},
    {k:'setDef',t:'switch',l:'Use this price as my default from now on',opt:1,show:v=>!W&&!!S.prices[c.id]&&parseMoney(v.unit)>0&&parseMoney(v.unit)!==S.prices[c.id].cur},
    {k:'notes',t:'area',l:W?'Notes':'Supplier or notes',opt:1}],
   init:()=>{const d=defDate(p),pr=priceOn(c.id,d);return{date:d,qty:'1',unit:pr!=null?rs(pr):'',notes:'',setDef:false,total:''};},
   fill:r=>({date:r.date,qty:qtyStr(r.qtyM),unit:rs(r.unitP),notes:r.notes||'',setDef:false,total:rs(r.amountP)}),
   build:v=>{const q=parseQty(v.qty),u=parseMoney(v.unit);return{cat:c.id,date:v.date,qtyM:q,unitP:u,amountP:mul(q,u),notes:v.notes.trim()};},
   after:(rec,v)=>{if(!W&&(!S.prices[c.id]||v.setDef))setPrice(c.id,rec.unitP,'all');},
   unitDate:true};
}
const payHint=v=>v.paid?'Shown as Paid and counted in this month’s spending.':'Shown as Due. It is not counted in spending until you check Paid.';
const agHint=v=>validDate(v.agEnd)?'Time left: '+leftInfo(v.agEnd).t+'.':'';
const lastAg=pd=>{const a=S.records.filter(r=>r.cat==='rent'&&r.dir===(pd?'paid':'received')&&r.x&&(r.x.agStart||r.x.agEnd)).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(y.ts||0)-(x.ts||0));return a[0]?{s:a[0].x.agStart||'',e:a[0].x.agEnd||''}:{s:'',e:''};};
function lastFuel(){const a=S.records.filter(r=>r.cat==='travel'&&r.sub==='fuel').sort((x,y)=>x.date<y.date?1:-1);return a[0]?a[0].unitP:null;}
function getSpec(p){
  const c=catOf(p.cat)||{};
  switch(p.spec){
    case 'water':return unitSpec(Object.assign({},p,{cat:'water'}));
    case 'unit':return unitSpec(p);
    case 'groceries':return{cat:'groceries',calc:true,edit:'toggle',calcIf:v=>!!v.det,title:p.id?'Edit grocery entry':'Add groceries',save:'Save groceries',
      fields:[{k:'date',t:'date',l:'Date'},{k:'title',t:'text',l:'Item or shopping description',ph:'e.g. Weekly vegetables',req:1},
       {k:'det',t:'switch',l:'Add quantity and price per unit',opt:1},
       {k:'qty',t:'qty',l:'Quantity',sfx:v=>v.uLabel||'',show:v=>!!v.det,req:1},{k:'uLabel',t:'text',l:'Unit',ph:'kg, litre, packet',opt:1,show:v=>!!v.det},
       {k:'unit',t:'money',l:'Price per unit',show:v=>!!v.det},{k:'total',t:'calc'},
       {k:'party',t:'text',l:'Store name',opt:1},{k:'notes',t:'area',l:'Notes',opt:1}],
      init:()=>({date:defDate(p),title:'',det:false,qty:'',uLabel:'',unit:'',total:'',party:'',notes:''}),
      fill:r=>({date:r.date,title:r.title||'',det:!!r.qtyM,qty:r.qtyM?qtyStr(r.qtyM):'',uLabel:(r.x&&r.x.unitLabel)||'',unit:r.unitP?rs(r.unitP):'',total:rs(r.amountP),party:r.party||'',notes:r.notes||''}),
      manualOf:r=>!(r.qtyM&&r.unitP&&mul(r.qtyM,r.unitP)===r.amountP),
      build:v=>{const o={cat:'groceries',date:v.date,title:v.title.trim(),party:v.party.trim(),notes:v.notes.trim(),amountP:parseMoney(v.total)};if(v.det){o.qtyM=parseQty(v.qty);o.unitP=parseMoney(v.unit);o.x={unitLabel:v.uLabel.trim()};}return o;}};
    case 'fuel':return{cat:'travel',calc:true,edit:'toggle',title:p.id?'Edit fuel purchase':'Add fuel purchase',save:'Save fuel purchase',
      fields:[{k:'date',t:'date',l:'Date'},{k:'fuelType',t:'seg',l:'Fuel type',opts:[['Petrol','Petrol'],['Diesel','Diesel'],['CNG','CNG'],['Other','Other']]},
       {k:'qty',t:'qty',l:'Quantity purchased',sfx:v=>v.fuelType==='CNG'?'kg':'litres',req:1},{k:'unit',t:'money',l:'Price per litre or unit'},{k:'total',t:'calc'},
       {k:'vehicle',t:'text',l:'Vehicle',ph:'e.g. Car, Scooter',opt:1},{k:'notes',t:'area',l:'Notes',opt:1}],
      init:()=>{const lp=lastFuel();return{date:defDate(p),fuelType:'Petrol',qty:'',unit:lp?rs(lp):'',total:'',vehicle:'',notes:''};},
      fill:r=>({date:r.date,fuelType:(r.x&&r.x.fuelType)||'Petrol',qty:qtyStr(r.qtyM),unit:rs(r.unitP),total:rs(r.amountP),vehicle:(r.x&&r.x.vehicle)||'',notes:r.notes||''}),
      manualOf:r=>mul(r.qtyM,r.unitP)!==r.amountP,
      build:v=>({cat:'travel',sub:'fuel',date:v.date,qtyM:parseQty(v.qty),unitP:parseMoney(v.unit),amountP:parseMoney(v.total),notes:v.notes.trim(),x:{fuelType:v.fuelType,vehicle:v.vehicle.trim(),u:v.fuelType==='CNG'?'kg':'litres'}})};
    case 'toll':return{cat:'travel',title:p.id?'Edit toll charge':'Add toll charge',save:'Save toll charge',
      fields:[{k:'date',t:'date',l:'Date'},{k:'route',t:'text',l:'Toll plaza or route',opt:1},{k:'vehicle',t:'text',l:'Vehicle',opt:1},{k:'amount',t:'money',l:'Toll amount'},
       {k:'method',t:'select',l:'Payment method',opt:1,opts:['Cash','FASTag','UPI','Card','Other']},{k:'notes',t:'area',l:'Notes',opt:1}],
      init:()=>({date:defDate(p),route:'',vehicle:'',amount:'',method:'',notes:''}),
      fill:r=>({date:r.date,route:r.party||'',vehicle:(r.x&&r.x.vehicle)||'',amount:rs(r.amountP),method:(r.x&&r.x.method)||'',notes:r.notes||''}),
      build:v=>({cat:'travel',sub:'toll',date:v.date,party:v.route.trim(),amountP:parseMoney(v.amount),notes:v.notes.trim(),x:{vehicle:v.vehicle.trim(),method:v.method}})};
    case 'distance':return{cat:'travel',store:'dist',title:p.id?'Edit journey':'Add journey',save:'Save journey',
      fields:[{k:'date',t:'date',l:'Date'},{k:'from',t:'text',l:'Starting location',opt:1},{k:'to',t:'text',l:'Destination',opt:1},{k:'km',t:'qty',l:'Distance travelled',sfx:'km',req:1},{k:'purpose',t:'area',l:'Purpose or notes',opt:1}],
      init:()=>({date:defDate(p),from:'',to:'',km:'',purpose:''}),
      fill:r=>({date:r.date,from:r.from||'',to:r.to||'',km:qtyStr(r.kmM),purpose:r.purpose||''}),
      build:v=>({date:v.date,from:v.from.trim(),to:v.to.trim(),kmM:parseQty(v.km),purpose:v.purpose.trim()})};
    case 'house':return{cat:'electricity',store:'houses',title:p.id?'Edit house':'Add house',save:'Save house',
      fields:[{k:'name',t:'text',l:'House name',ph:'e.g. Main home, Flat 4B',req:1},{k:'addr',t:'text',l:'Address or area',opt:1},{k:'meter',t:'text',l:'Consumer or meter number',opt:1}],
      init:()=>({name:'',addr:'',meter:''}),
      fill:r=>({name:r.name,addr:r.addr||'',meter:r.meter||''}),
      build:v=>({name:v.name.trim(),addr:v.addr.trim(),meter:v.meter.trim()}),
      check:v=>S.houses.some(h=>h.id!==F.id&&h.name.toLowerCase()===v.name.trim().toLowerCase())?{name:'You already have a house with this name.'}:{}};
    case 'bill':return{cat:c.id,title:(p.id?'Edit ':'Add ')+c.name.toLowerCase(),save:'Save bill',
      fields:(c.id==='electricity'?[{k:'houseId',t:'hsel',l:'House'}]:[]).concat([{k:'period',t:'month',l:'Billing month'},{k:'date',t:'date',l:'Payment or bill date'},{k:'amount',t:'money',l:'Bill amount'},
       {k:'party',t:'text',l:c.id==='electricity'?'Provider':'Provider or meter number',opt:1},{k:'due',t:'date',l:'Due date',opt:1},{k:'paid',t:'switch',l:'Paid',hint:payHint},{k:'notes',t:'area',l:'Notes',opt:1}]),
      init:()=>({houseId:p.houseId||(houseOf(UI.eh)?UI.eh:(S.houses.length===1?S.houses[0].id:'')),period:S.mon,date:defDate(p),amount:'',party:'',due:'',paid:false,notes:''}),
      fill:r=>({houseId:r.houseId||'',period:r.period||r.date.slice(0,7),date:r.date,amount:rs(r.amountP),party:r.party||'',due:(r.x&&r.x.due)||'',paid:r.status!=='due',notes:r.notes||''}),
      build:v=>Object.assign({cat:c.id,date:v.date,period:v.period,amountP:parseMoney(v.amount),party:v.party.trim(),status:v.paid?'paid':'due',notes:v.notes.trim(),x:{due:v.due}},c.id==='electricity'?{houseId:v.houseId}:{}),
      dup:rec=>{const o=S.records.find(r=>r.cat===c.id&&r.id!==rec.id&&r.period===rec.period&&(c.id!=='electricity'||r.houseId===rec.houseId));return o?'A '+c.name.toLowerCase()+(c.id==='electricity'&&houseOf(rec.houseId)?' for '+houseOf(rec.houseId).name:'')+' for '+monLabel(rec.period)+' is already saved ('+fmt(o.amountP)+'). You can still save this one.':'';}};
    case 'rent':{const pd=(p.dir||'paid')==='paid';
      return{cat:'rent',title:(p.id?'Edit rent ':'Log rent ')+(pd?'paid':'received'),save:pd?'Save rent paid':'Save rent received',
      fields:[{k:'period',t:'month',l:'Rent for month'},{k:'date',t:'date',l:pd?'Date paid':'Date received'},{k:'amount',t:'money',l:'Amount'},
       {k:'party',t:'text',l:pd?'Landlord or property':'Tenant or property',ph:pd?'e.g. Flat 4B':'e.g. Room 1',opt:1},
       {k:'method',t:'select',l:'Payment method',opt:1,opts:['Cash','UPI','Bank transfer','Cheque','Other']},
       {k:'agStart',t:'date',l:'Agreement start date',opt:1},{k:'agEnd',t:'date',l:'Agreement end date',opt:1,hint:agHint},{k:'paid',t:'switch',l:'Paid',hint:v=>v.paid?(pd?'Shown as Paid and counted in this month’s spending.':'Shown as Paid. Rent received is income and is not counted as spending.'):(pd?'Shown as Due. It is not counted in spending until you check Paid.':'Shown as Due. Check Paid when the tenant has paid.')},{k:'notes',t:'area',l:'Notes',opt:1}],
      init:()=>({period:S.mon,date:defDate(p),amount:'',party:'',method:'',agStart:lastAg(pd).s,agEnd:lastAg(pd).e,paid:false,notes:''}),
      fill:r=>({period:r.period||r.date.slice(0,7),date:r.date,amount:rs(r.amountP),party:r.party||'',method:(r.x&&r.x.method)||'',agStart:(r.x&&r.x.agStart)||'',agEnd:(r.x&&r.x.agEnd)||'',paid:r.status!=='due',notes:r.notes||''}),
      build:v=>({cat:'rent',dir:pd?'paid':'received',date:v.date,period:v.period,amountP:parseMoney(v.amount),party:v.party.trim(),status:v.paid?'paid':'due',notes:v.notes.trim(),x:{method:v.method,agStart:v.agStart,agEnd:v.agEnd}}),
      check:v=>(v.agStart&&v.agEnd&&v.agEnd<=v.agStart)?{agEnd:'The end date must be after the start date.'}:{},
      dup:rec=>{const o=S.records.find(r=>r.cat==='rent'&&r.dir===rec.dir&&r.id!==rec.id&&r.period===rec.period&&(r.party||'').toLowerCase()===(rec.party||'').toLowerCase());return o?'Rent '+(pd?'paid':'received')+' for '+monLabel(rec.period)+(rec.party?' ('+rec.party+')':'')+' is already logged ('+fmt(o.amountP)+'). You can still save this one.':'';}};}
    default:return{cat:c.id||'other',title:(p.id?'Edit ':'Add ')+(c.name||'expense').toLowerCase(),save:'Save expense',
      fields:[{k:'date',t:'date',l:'Date'},{k:'title',t:'text',l:'What was it for?',ph:'Short description',opt:1},{k:'amount',t:'money',l:'Amount'},{k:'notes',t:'area',l:'Notes',opt:1}],
      init:()=>({date:defDate(p),title:'',amount:'',notes:''}),
      fill:r=>({date:r.date,title:r.title||'',amount:rs(r.amountP),notes:r.notes||''}),
      build:v=>({cat:c.id||'other',date:v.date,title:v.title.trim(),amountP:parseMoney(v.amount),notes:v.notes.trim()})};
  }
}
function openEntry(p){
  const sp=getSpec(p);const arr=sp.store==='dist'?S.dist:sp.store==='houses'?S.houses:S.records;
  const rec=p.id?arr.find(r=>r.id===p.id):null;
  F={sp:sp,p:p,id:rec?rec.id:uid(),vals:rec?sp.fill(rec):sp.init(),manual:false,saving:false,dupAck:false,unitTouched:!!rec};
  if(rec&&sp.manualOf)F.manual=sp.manualOf(rec);
  if(p.pre&&!rec)Object.assign(F.vals,p.pre);
  go('entry',p);
}
function entryFor(c){return c.kind==='groceries'?{spec:'groceries'}:c.kind==='unit'?{spec:'unit',cat:c.id}:c.kind==='bill'?{spec:'bill',cat:c.id}:{spec:'simple',cat:c.id};}
function editParams(r){const c=catOf(r.cat)||{};let s='simple';
  if(r.cat==='water')s='water';else if(r.cat==='travel')s=r.sub==='fuel'?'fuel':r.sub==='toll'?'toll':'simple';
  else if(c.kind==='unit')s='unit';else if(c.kind==='bill')s='bill';else if(c.kind==='rent')s='rent';else if(c.kind==='groceries')s='groceries';
  return{spec:s,cat:r.cat,id:r.id,dir:r.dir};}

/* form logic */
function recalc(){
  if(!F)return;const sp=F.sp,v=F.vals;if(!sp.calc)return;
  const on=!sp.calcIf||sp.calcIf(v),q=parseQty(v.qty),u=parseMoney(v.unit);
  if(on&&!F.manual)v.total=(q&&u)?rs(mul(q,u)):'';
  const ti=$('#f_total');if(ti){if(document.activeElement!==ti)ti.value=v.total||'';ti.readOnly=on&&!F.manual;ti.placeholder='0';}
  const fm=$('#formula');if(fm)fm.textContent=on?((q&&u)?fmt(u)+' × '+qtyStr(q)+' = '+fmt(mul(q,u)):'Enter quantity and price'):'Enter the total amount';
  const nt=$('#calcNote');if(nt)nt.textContent=!on?'':(F.manual?'Entered manually':'Calculated automatically');
  const el=$('#editLink');if(el){el.hidden=!(on&&sp.edit==='toggle');el.textContent=F.manual?'Use calculated total':'Edit total';}
}
function syncShow(){
  if(!F)return;F.sp.fields.forEach(f=>{const el=$('.fld[data-fk="'+f.k+'"]');if(el&&f.show)el.hidden=!f.show(F.vals);});
  F.sp.fields.forEach(f=>{if(f.hint){const h=$('#hint_'+f.k);if(h)h.textContent=f.hint(F.vals);}});
}
function onField(el){
  if(!F)return;const k=el.dataset.f,v=F.vals;
  v[k]=el.type==='checkbox'?el.checked:el.value;
  if(k==='total'&&!el.readOnly)F.manual=true;
  if(k==='unit')F.unitTouched=true;
  if(k==='date'&&F.sp.unitDate&&!F.unitTouched&&validDate(v.date)){const pr=priceOn(F.sp.cat,v.date);if(pr!=null){v.unit=rs(pr);const ui=$('#f_unit');if(ui)ui.value=v.unit;}}

function validate(){
  const sp=F.sp,v=F.vals,e={};
  sp.fields.forEach(f=>{
    if(f.show&&!f.show(v))return;const val=v[f.k];
    if(f.t==='date'){if(f.opt&&!val)return;if(!validDate(val))e[f.k]='Enter a valid date.';}
    else if(f.t==='month'){if(!validMonth(val))e[f.k]='Choose a month.';}
    else if(f.t==='money'&&f.k!=='unit'){const m=parseMoney(val);if(f.opt&&!val)return;if(m==null||m<=0)e[f.k]='Enter an amount above 0, with up to 2 decimals.';else if(m>MAX_MONEY)e[f.k]='That amount looks too large.';}
    else if(f.t==='money'){const m=parseMoney(val);if(m==null||m<=0)e[f.k]='Enter a price above 0, with up to 2 decimals.';else if(m>MAX_UNIT)e[f.k]='That price looks too large.';}
    else if(f.t==='qty'){const q=parseQty(val);if(q==null||q<=0)e[f.k]='Enter a quantity above 0 (up to 3 decimals).';else if(q>MAX_QTY)e[f.k]='That quantity looks too large.';}
    else if(f.t==='hsel'){if(!houseOf(val))e[f.k]='Choose a house.';}
    else if(f.t==='text'&&f.req&&!String(val||'').trim())e[f.k]='This field is required.';
  });
  if(sp.calc&&(!sp.calcIf||sp.calcIf(v)||true)){
    const needTotal=!sp.calcIf||!sp.calcIf(v)||F.manual||sp.edit==='toggle';
    const m=parseMoney(v.total);if((!sp.calcIf||!sp.calcIf(v)||F.manual)&&(m==null||m<=0))e.total='Enter a total above 0.';
  }
  if(sp.check)Object.assign(e,sp.check(v));
  return e;
}

function saveForm(){

function barSvg(items,label){
  const W=340,H=172,pl=6,pr=6,pt=22,pb=26,n=items.length,max=Math.max(1,...items.map(i=>i.v)),bw=(W-pl-pr)/n,bar=Math.min(34,bw*.6);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'"><line class="ax" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  items.forEach((it,i)=>{const h=Math.round((H-pt-pb)*it.v/max),x=pl+i*bw+(bw-bar)/2,y=H-pb-h;
    s+='<rect class="b'+(it.sel?' sel':'')+'" x="'+x.toFixed(1)+'" y="'+y+'" width="'+bar.toFixed(1)+'" height="'+(it.v?Math.max(h,2):0)+'" rx="5"/>';
    if(it.v)s+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(y-6)+'" text-anchor="middle">'+fmtK(it.v)+'</text>';
    s+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+it.l+'</text>';});
  return s+'</svg>';
}

const fmtClock=()=>new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});

function miniCal(mk){
  const a=mk.split('-').map(Number),y=a[0],m=a[1],first=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate(),t=today();
  const has=new Set(S.records.map(r=>r.date).concat(S.dist.map(d=>d.date)));
  let h='<div class="cal" role="group" aria-label="'+monLabel(mk)+'">'+['S','M','T','W','T','F','S'].map(d=>'<div class="dw" aria-hidden="true">'+d+'</div>').join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++){const ds=ymd(y,m,d);h+='<div class="day'+(has.has(ds)?' has':'')+(ds===t?' sel':'')+'"'+(ds===t?' aria-current="date"':'')+'>'+d+'<i></i></div>';}
  return h+'</div>';
}
let lastDay=today();
function tick(){
  const t=today();
  if(t!==lastDay){
    const prevMon=lastDay.slice(0,7);lastDay=t;UI.wsel=null;
    let msg='New day: '+fmtDate(t);
    if(S.mon===prevMon&&t.slice(0,7)!==prevMon){S.mon=t.slice(0,7);msg='New month: '+monLabel(S.mon);}

/* ---------- CSV, backup crypto ---------- */
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  const h=['type','date','reporting_month','category','detail','direction','title_or_party','quantity','unit_price_inr','amount_inr','status','notes','added_at'];
  const L=[h.join(',')];
  S.records.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(r=>{const c=catOf(r.cat);L.push([ 'expense',r.date,recMonth(r),c?c.name:r.cat,r.sub||(houseOf(r.houseId)?houseOf(r.houseId).name:''),r.dir||'',(r.title||r.party||''),r.qtyM?qtyStr(r.qtyM):'',r.unitP?rs(r.unitP):'',rs(r.amountP),r.status||'',r.notes||'',fmtStamp(r.ts)].map(csvCell).join(','));});
  S.dist.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(d=>L.push(['distance',d.date,d.date.slice(0,7),'Travel','distance','',(d.from||'')+(d.to?' to '+d.to:''),qtyStr(d.kmM)+' km','','','',d.purpose||'',fmtStamp(d.ts)].map(csvCell).join(',')));
  return L.join('\n');
}
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s);}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pass,salt,iter){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptBackup(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=200000;
  const data=JSON.parse(JSON.stringify(S));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},await deriveKey(pass,salt,iter),new TextEncoder().encode(JSON.stringify({app:'expenses',v:1,data:data})));
  return JSON.stringify({fmt:'expenses-backup',v:1,kdf:'PBKDF2-SHA256',iter:iter,salt:b64e(salt),iv:b64e(iv),ct:b64e(new Uint8Array(ct))});
}
function validateData(d){
  if(!d||typeof d!=='object'||d.app!=='expenses'||d.v!==1||!d.data)return 'This is not an Expenses backup.';
  const x=d.data;if(!Array.isArray(x.records)||!Array.isArray(x.dist)||!Array.isArray(x.cats)||typeof x.prices!=='object')return 'The backup is missing required sections.';
  if(x.records.length>50000||x.dist.length>50000||x.cats.length>200)return 'The backup is larger than expected.';
  const ids=new Set(x.cats.map(c=>c&&c.id));
  for(const c of x.cats){if(!c||typeof c.id!=='string'||typeof c.name!=='string'||c.name.length>60||!/^#[0-9a-fA-F]{6}$/.test(c.color||'')||!ICONS[c.icon])return 'A category in the backup is not valid.';}
  if(x.houses!==undefined&&(!Array.isArray(x.houses)||x.houses.length>200||x.houses.some(h=>!h||typeof h.id!=='string'||typeof h.name!=='string'||h.name.length>80)))return 'A house in the backup is not valid.';
  for(const r of x.records){if(!r||typeof r.id!=='string'||!validDate(r.date)||!Number.isInteger(r.amountP)||r.amountP<0||r.amountP>MAX_MONEY*10||!ids.has(r.cat)||(r.period&&!validMonth(r.period)))return 'A record in the backup is not valid.';}
  for(const r of x.dist){if(!r||typeof r.id!=='string'||!validDate(r.date)||!Number.isInteger(r.kmM)||r.kmM<0)return 'A journey in the backup is not valid.';}
  return null;
}

 eh:el=>{UI.eh=el.dataset.id;draw(true);},

 delHouse:el=>{const h=houseOf(el.dataset.id);if(!h)return;const n=S.records.filter(r=>r.houseId===h.id).length;
   ask({title:'Delete '+h.name+'?',msg:n?'Its '+n+' electricity bill'+(n===1?'':'s')+' will be deleted too. This cannot be undone.':'This house has no bills. This cannot be undone.',ok:'Delete house',danger:true,fn:()=>{S.records=S.records.filter(r=>r.houseId!==h.id);S.houses=S.houses.filter(x=>x.id!==h.id);if(UI.eh===h.id)UI.eh='all';persist();closeL();draw(true);toast('House deleted');}});},
 /* rent */
 rentPick:el=>{UI.rentDir=el.dataset.v;go('rentLog');},
 rentDir:el=>{UI.rentDir=el.dataset.v;draw(true);},
 rentAdd:()=>openQuick({cat:'rent',dir:UI.rentDir}),
 /* entry */
 saveForm:saveForm,
 seg:el=>{if(!F)return;F.vals[el.dataset.k]=el.dataset.v;const f=F.sp.fields.find(x=>x.k===el.dataset.k),old=el.closest('.fld');old.outerHTML=fieldHtml(f);recalc();syncShow();},
 step:el=>{if(!F)return;const k=el.dataset.k,cur=parseQty(F.vals[k])||0;let n=Math.max(1,Math.round(cur/1000)+(+el.dataset.d));n=Math.min(n,10000);F.vals[k]=String(n);const i=$('#f_'+k);i.value=F.vals[k];onField(i);},
 editTotal:()=>{if(!F)return;F.manual=!F.manual;recalc();if(F.manual){const t=$('#f_total');t.focus();t.select();}},
 /* settings */
 theme:el=>{S.theme=el.dataset.v;applyTheme();persist();draw(true);},
 lockSetup:()=>go('lockSetup'), privacy:()=>go('privacy'), backup:()=>go('backup'),
 lockTO:el=>{S.lock.timeout=+el.dataset.v;persist();draw(true);},
 lockNow:()=>{showLock();}, lockClose:()=>{lockl.hidden=true;},
 unlock:()=>{sheet('<h2>Confirm it’s you</h2><p class="sub">On Android this is the system fingerprint, face or screen lock prompt. This preview only simulates it.</p><div class="row2"><button class="btn" data-act="closeL">Cancel</button><button class="btn pri" data-act="unlockOk">Simulate success</button></div>',true);},
 unlockOk:()=>{closeL();lockl.hidden=true;},
 exportCsv:()=>{const t=buildCsv();sheet('<h2>Export to CSV</h2><p class="sub" style="margin-bottom:10px">Cells that start with a formula character are made safe for spreadsheets. The Android app saves this to a file you choose. In this preview, copy the text.</p><textarea class="mono" id="csvOut" readonly aria-label="CSV contents">'+esc(t)+'</textarea><div class="row2"><button class="btn" data-act="closeL">Close</button><button class="btn pri" data-act="copyCsv">Copy CSV</button></div>');},
 copyCsv:()=>copyFrom('#csvOut'),
 delCat:()=>{sheet('<h2>Delete a category’s records</h2><p class="sub" style="margin-bottom:8px">The category stays. Only its records are removed.</p><div class="list">'+S.cats.map(c=>{const n=S.records.filter(r=>r.cat===c.id).length+(c.id==='travel'?S.dist.length:0);return '<button class="rec" data-act="delCatGo" data-id="'+esc(c.id)+'"'+(n?'':' disabled style="opacity:.5"')+'>'+chipOf(c)+'<span class="rt"><b>'+esc(c.name)+'</b><small>'+n+' record'+(n===1?'':'s')+'</small></span></button>';}).join('')+'</div><button class="btn block" data-act="closeL">Close</button>');},
 delCatGo:el=>{const c=catOf(el.dataset.id);if(!c)return;ask({title:'Delete all '+c.name+' records?',msg:'Every record in this category is removed from this device. This cannot be undone.',ok:'Delete records',danger:true,fn:()=>{S.records=S.records.filter(r=>r.cat!==c.id);if(c.id==='travel')S.dist=[];persist();closeL();draw(true);toast('Records deleted');}});},
 clearAll:()=>ask({title:'Clear all data?',msg:'This permanently deletes every record, price and setting on this device. Consider making a backup first.',ok:'Clear everything',danger:true,type:'DELETE',fn:()=>{const t=S.theme;S=blank();S.onboarded=true;S.theme=t;persist();closeL();tab('home');toast('All data cleared');}}),
 reseed:()=>ask({title:'Reload demo data?',msg:'This replaces everything with sample records tagged DEMO.',ok:'Reload',fn:()=>{const t=S.theme;S=blank();S.onboarded=true;S.theme=t;seedDemo(S);persist();closeL();tab('home');toast('Demo data loaded');}}),
 mkBackup:async()=>{const e=$('#bErr'),a=DLG.bp1||'',b=DLG.bp2||'';if(a.length<8){e.textContent='Use at least 8 characters.';return;}if(a!==b){e.textContent='The passphrases do not match.';return;}
   try{const t=await encryptBackup(a);e.textContent='';sheet('<h2>Backup created</h2><p class="sub" style="margin-bottom:10px">Copy this text and keep it somewhere safe. The Android app writes it to a file you choose.</p><textarea class="mono" id="bkOut" readonly aria-label="Encrypted backup">'+esc(t)+'</textarea><div class="row2"><button class="btn" data-act="closeL">Close</button><button class="btn pri" data-act="copyBk">Copy backup</button></div>');}catch(x){e.textContent='Encryption is not available in this browser.';}},
 copyBk:()=>copyFrom('#bkOut'),
 chkRestore:async()=>{const e=$('#rErr');e.textContent='';let env;
   try{env=JSON.parse((DLG.rb||'').trim());}catch(x){e.textContent='That text is not a valid backup.';return;}
   if(!env||env.fmt!=='expenses-backup'||env.v!==1||typeof env.salt!=='string'||typeof env.iv!=='string'||typeof env.ct!=='string'||!Number.isInteger(env.iter)||env.iter<100000||env.iter>1000000){e.textContent='That text is not a valid backup.';return;}
   try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},await deriveKey(DLG.rp||'',b64d(env.salt),env.iter),b64d(env.ct));const d=JSON.parse(new TextDecoder().decode(pt));const m=validateData(d);if(m){e.textContent=m;return;}pendingRestore=d.data;
     ask({title:'Replace everything with this backup?',msg:'It contains '+d.data.records.length+' records and '+d.data.dist.length+' journeys. Your current data on this device will be replaced.',ok:'Restore',danger:true,fn:()=>{const t=S.theme;S=pendingRestore;pendingRestore=null;S.v=1;if(!Array.isArray(S.houses))S.houses=[];S.onboarded=true;S.theme=S.theme||t;S.mon=curMonth();if(!S.lock)S.lock={on:false,timeout:30};persist();applyTheme();closeL();tab('home');toast('Backup restored');}});
   }catch(x){e.textContent='Wrong passphrase, or the backup is damaged.';}},
 ncIcon:el=>{DLG.nc.icon=el.dataset.v;draw(true);}, ncColor:el=>{DLG.nc.color=el.dataset.v;draw(true);}, ncKind:el=>{DLG.nc.kind=el.dataset.v;draw(true);},
 saveCat:()=>{const n=DLG.nc,name=(n.name||'').trim(),e=$('#ncErr');
   if(!name){e.textContent='Give the category a name.';return;}
   if(S.cats.some(c=>c.name.toLowerCase()===name.toLowerCase())){e.textContent='You already have a category with this name.';return;}
   if(n.kind==='unit'&&!(n.unit||'').trim()){$('#ncuErr').textContent='Say what you count, such as can or packet.';return;}
   const id='c'+Date.now().toString(36);const u=(n.unit||'').trim();
   S.cats.push({id:id,name:name,icon:n.icon,color:n.color,kind:n.kind,unit:u,units:u+'s'});persist();DLG.nc=null;stack.pop();draw();toast('Category created');}
};
function copyFrom(sel){const t=$(sel);if(!t)return;const done=()=>toast('Copied');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Select and copy the text');});}catch(e){t.select();toast('Select and copy the text');}}
function applyTheme(){const r=document.documentElement;if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);}

/* ---------- events ---------- */
$('#shell').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e);});
function onInput(e){
  const el=e.target;
  if(el.dataset.qa&&QA){QA[el.dataset.qa]=el.value;if(el.dataset.qa==='amount')QA.touched=true;else if(el.dataset.qa==='party'&&!QA.touched){QA.amount=qaGuess();const a=$('#qaAmt');if(a)a.value=QA.amount;}const ea=$('#qaErrA');if(ea)ea.textContent='';qaWarn();return;}
  if(el.dataset.f){onField(el);return;}
  if(el.dataset.d){DLG[el.dataset.d]=el.value;if(el.dataset.d==='ncn'&&DLG.nc)DLG.nc.name=el.value;if(el.dataset.d==='ncu'&&DLG.nc)DLG.nc.unit=el.value;return;}
  if(el.dataset.q){UI.q=el.value;const l=$('#explist');if(l)l.innerHTML=expListHtml();return;}
  if(el.dataset.sort){UI.sort=el.value;const l=$('#explist');if(l)l.innerHTML=expListHtml();return;}
  if(el.dataset.lock){S.lock.on=el.checked;persist();draw(true);}
}
$('#shell').addEventListener('input',onInput);
$('#shell').addEventListener('change',onInput);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!layer.hidden)closeL();});

applyTheme();draw();
if(S.lock.on&&S.onboarded)showLock();
setInterval(tick,1000);
})();
</script>
